name: publish packages

on:
  workflow_dispatch:
    inputs:
      publish_api:
        description: 'Publish :api'
        type: boolean
        required: false
        default: true
      publish_core:
        description: 'Publish :core'
        type: boolean
        required: false
        default: true
      publish_client_core:
        description: 'Publish :client-core'
        type: boolean
        required: false
        default: true
      snapshot:
        description: 'Append -SNAPSHOT to artifact versions'
        type: boolean
        required: false
        default: false
  push:
    branches: ['master']
    paths:
      - 'api/**'
      - 'core/**'
      - 'client-core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: select modules
        id: modules
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected_modules=()
            if [[ "${{ inputs.publish_api }}" == "true" ]]; then
              selected_modules+=("api")
            fi
            if [[ "${{ inputs.publish_core }}" == "true" ]]; then
              selected_modules+=("core")
            fi
            if [[ "${{ inputs.publish_client_core }}" == "true" ]]; then
              selected_modules+=("client-core")
            fi
            raw_modules="$(IFS=,; echo "${selected_modules[*]}")"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              changed_files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-tree -r --name-only HEAD)"
            else
              changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
            fi

            raw_modules=""
            while IFS= read -r path; do
              case "$path" in
                api/*) raw_modules="$raw_modules,api" ;;
                core/*) raw_modules="$raw_modules,core" ;;
                client-core/*) raw_modules="$raw_modules,client-core" ;;
                build.gradle.kts|settings.gradle.kts|gradle/*) raw_modules="api,core,client-core" ;;
              esac
            done <<< "$changed_files"
          fi

          modules="$(
            tr ',' '\n' <<< "$raw_modules" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              awk 'NF' |
              sort -u |
              paste -sd, -
          )"

          if [[ -z "$modules" ]]; then
            echo "No publishable shared modules changed."
            echo "modules=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Selected modules: $modules"

      - name: build selected modules
        if: steps.modules.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra modules <<< "${{ steps.modules.outputs.modules }}"
          tasks=()
          for module in "${modules[@]}"; do
            case "$module" in
              api) tasks+=("checkKotlinAbi" ":api:build") ;;
              core) tasks+=(":core:build") ;;
              client-core) tasks+=(":client-core:build") ;;
              *) echo "Unknown shared module '$module'" >&2; exit 1 ;;
            esac
          done
          ./gradlew "${tasks[@]}" --stacktrace

      - name: publish selected modules
        if: steps.modules.outputs.modules != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          SNAPSHOT_INPUT: ${{ inputs.snapshot }}
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra modules <<< "${{ steps.modules.outputs.modules }}"

          snapshot_flag="false"
          target_prefix="releases"
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$SNAPSHOT_INPUT" == "true" ]]; then
            snapshot_flag="true"
            target_prefix="snapshots"
          fi

          staging_dir="$RUNNER_TEMP/r2-staging"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"

          echo "Target R2 prefix: $target_prefix (snapshot: $snapshot_flag)"

          # Pre-fetch existing maven metadata from R2 for seamless multi-version updates
          for module in "${modules[@]}"; do
            metadata_path="org/lolicode/moemusic/$module/maven-metadata.xml"
            mkdir -p "$staging_dir/org/lolicode/moemusic/$module"
            if aws s3 cp "s3://$R2_BUCKET/$target_prefix/$metadata_path" "$staging_dir/$metadata_path" --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null; then
              echo "Fetched existing $metadata_path from R2"
            else
              echo "No existing $metadata_path found on R2 ($target_prefix)"
            fi

            # Check release immutability
            if [[ "$snapshot_flag" == "false" ]]; then
              version="$(./gradlew -q ":$module:properties" -Pmoemusic.snapshot=false | awk -F': ' '$1 == "version" {print $2}')"
              echo "Checking immutability for $module version $version on R2..."
              if aws s3 ls "s3://$R2_BUCKET/releases/org/lolicode/moemusic/$module/$version/" --endpoint-url "$AWS_ENDPOINT_URL" 2>/dev/null | grep -q '.*'; then
                echo "::error::Release version $version for module '$module' already exists on R2 and is immutable!"
                exit 1
              fi
            fi
          done

          tasks=()
          for module in "${modules[@]}"; do
            case "$module" in
              api) tasks+=("publishApiToPackageRegistries") ;;
              core) tasks+=("publishCoreToPackageRegistries") ;;
              client-core) tasks+=("publishClientCoreToPackageRegistries") ;;
              *) echo "Unknown shared module '$module'" >&2; exit 1 ;;
            esac
          done

          ./gradlew -Pmoemusic.snapshot="$snapshot_flag" -Pmoemusic.publish.stagingDir="$staging_dir" "${tasks[@]}" --stacktrace

          # Sync artifacts to Cloudflare R2
          if [[ "$snapshot_flag" == "false" ]]; then
            # Release files (immutable CDN caching)
            aws s3 sync "$staging_dir" "s3://$R2_BUCKET/$target_prefix" \
              --endpoint-url "$AWS_ENDPOINT_URL" \
              --exclude "*/maven-metadata.xml*" \
              --cache-control "public, max-age=31536000, immutable"

            # Metadata files (short revalidation TTL)
            aws s3 sync "$staging_dir" "s3://$R2_BUCKET/$target_prefix" \
              --endpoint-url "$AWS_ENDPOINT_URL" \
              --exclude "*" \
              --include "*/maven-metadata.xml*" \
              --cache-control "public, max-age=300, must-revalidate"
          else
            # Snapshot files (short TTL)
            aws s3 sync "$staging_dir" "s3://$R2_BUCKET/$target_prefix" \
              --endpoint-url "$AWS_ENDPOINT_URL" \
              --cache-control "public, max-age=300, must-revalidate"
          fi

          echo "Successfully published to https://maven.lolicode.org/$target_prefix/"
